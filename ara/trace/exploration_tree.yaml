tree:
  - id: N01
    type: question
    title: "Does a semantic skill graph reduce agent cognitive overhead vs raw MCP loading?"
    provenance: user
    timestamp: "2026-05-31T00:00"
    description: >
      Core research question motivating skillgraph-mcp. Hypothesis: collapsing N*M
      tool schemas into a compact skill index + on-demand retrieval reduces upfront
      token cost while preserving full tool access.
    children:

      - id: N02
        type: experiment
        title: "Measure upfront token cost: gateway vs raw (10 servers, 113 tools)"
        provenance: ai-executed
        timestamp: "2026-05-31T00:00"
        result: >
          Gateway (list_skills): 287 tokens. Raw estimate: ~3,660 tokens. Reduction: 92%.
          Playwright per-server cost empirically measured: 745 tokens for 23 tools.
        evidence: [C01, "T01-token-measurements.md"]
        children:

          - id: N03
            type: decision
            title: "Use playwright as the empirical sample server for per-tool rate"
            provenance: ai-suggested
            timestamp: "2026-05-31T00:00"
            choice: >
              playwright chosen (23 tools, mid-size, typical real-world server).
              Rate: 32.4 tokens/tool used to estimate all other servers.
            alternatives:
              - "chrome-devtools (29 tools, largest — would give higher estimate)"
              - "memory (9 tools, smallest — would give lower estimate)"
            evidence: >
              Playwright is median-sized and has a concrete, verifiable use_skill response.

  - id: N04
    type: question
    title: "Is skillgraph-mcp ready to publish / show publicly?"
    provenance: user
    timestamp: "2026-05-31T00:00"
    description: >
      LinkedIn-readiness assessment. Covers install story, demo config, token
      evidence, and paper abstract.
    children:

      - id: N05
        type: decision
        title: "Fix Getting Started example: replace github-issues (http) with memory (stdio)"
        provenance: user
        timestamp: "2026-05-31T00:00"
        choice: >
          Use @modelcontextprotocol/server-memory (9 tools, zero credentials, stdio)
          instead of github-issues (requires Copilot subscription, type:http, blocks startup).
        alternatives:
          - "sequential-thinking (stdio but only 1 tool — undersells progressive disclosure)"
          - "keep github-issues (realistic but bad first-run experience)"
        evidence: >
          github-issues blocks startup on bad token; memory works immediately for anyone.

      - id: N06
        type: decision
        title: "Fix install snippet: hardcoded VERSION=0.1.0 → dynamic GitHub API lookup"
        provenance: user
        timestamp: "2026-05-31T00:00"
        choice: >
          Use curl + GitHub API to resolve latest tag dynamically. No manual bump needed.
        alternatives:
          - "Hardcoded version (rots immediately on release)"
          - "latest/download/ redirect (fails: goreleaser embeds version in filename)"
        evidence: >
          v1.0.0 is current latest; README showed 0.1.0 — stale on day one after release.
